# =============================================================================
# POC agéntica NUNSYS — inferencia 100% local con vLLM en Docker Compose
#
# Presupuesto de VRAM (RTX 5070, 8 GB):
#   - servicio `llm`:        Qwen/Qwen3-4B-AWQ        (≈2.6 GB pesos, AWQ 4-bit)
#   - servicio `embeddings`: multilingual-e5-small     (≈0.5 GB)
#   - gpu-memory-utilization 0.62 + 0.22 = 0.84 de 8 GB ≈ 6.7 GB (holgura <1.3 GB)
#
# Todos los puertos se publican SOLO en 127.0.0.1.
# La inferencia remota está bloqueada en la aplicación (ALLOW_REMOTE_INFERENCE=false).
# =============================================================================

name: agentic-poc

volumes:
  model-cache:
  erp-data:
  app-data:
  vector-store:
  documents:

services:
  # ---------------------------------------------------------------------------
  # Descarga inicial de modelos (una sola vez; usa el volumen compartido)
  # ---------------------------------------------------------------------------
  model-loader:
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - model-cache:/root/.cache/huggingface
      - ./:/work
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    command: >
      sh -c "pip install -q huggingface_hub &&
             python scripts/download_models.py"
    restart: "no"

  # ---------------------------------------------------------------------------
  # vLLM: LLM (OpenAI-compatible) — servicio llm:8000
  # ---------------------------------------------------------------------------
  llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0}
    depends_on:
      model-loader:
        condition: service_completed_successfully
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_LOGGING_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen3-4B-AWQ
      --served-model-name local-llm
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.62
      --max-model-len 4096
      --max-num-seqs 2
      --quantization awq_marlin
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --reasoning-parser qwen3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 200s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM: embeddings (OpenAI-compatible) — servicio embeddings:8001
  # ---------------------------------------------------------------------------
  embeddings:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0}
    depends_on:
      model-loader:
        condition: service_completed_successfully
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model intfloat/multilingual-e5-small
      --served-model-name local-embeddings
      --host 0.0.0.0
      --port 8001
      --convert embed
      --gpu-memory-utilization 0.22
      --max-model-len 512
      --max-num-seqs 8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API de producción simulada (sistema externo de la POC)
  # ---------------------------------------------------------------------------
  production-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-poc-app:local
    command: >
      uvicorn agentic_poc.production_api.app:app
      --host 0.0.0.0 --port 8090
    environment: &app-env
      APP_ENV: development
      LOG_LEVEL: INFO
      LOG_FORMAT: text
      ALLOW_REMOTE_INFERENCE: "false"
      LLM_BASE_URL: http://llm:8000/v1
      LLM_MODEL: local-llm
      LLM_API_KEY: local-vllm-key
      EMBEDDINGS_BASE_URL: http://embeddings:8001/v1
      EMBEDDINGS_MODEL: local-embeddings
      EMBEDDINGS_API_KEY: local-vllm-key
      EMBEDDINGS_DIMENSIONS: "384"
      PRODUCTION_API_URL: http://production-api:8090
      BACKEND_URL: http://api:8080
      CORS_ORIGINS: http://localhost:8585,http://127.0.0.1:8585
      ERP_DATABASE_URL: sqlite:////data/erp/northwind.db
      APP_DB_PATH: /data/app/app.db
      VECTOR_STORE_PATH: /data/vector_store
      DOCUMENTS_DIR: /data/documents
    volumes:
      - erp-data:/data/erp
      - app-data:/data/app
      - vector-store:/data/vector_store
      - documents:/data/documents
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Bootstrap: siembra el ERP, genera los PDFs de ejemplo e ingiere el RAG
  # ---------------------------------------------------------------------------
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-poc-app:local
    depends_on:
      embeddings:
        condition: service_healthy
      production-api:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - erp-data:/data/erp
      - app-data:/data/app
      - vector-store:/data/vector_store
      - documents:/data/documents
      - ./scripts:/app/scripts
    command: python scripts/bootstrap.py
    restart: "no"

  # ---------------------------------------------------------------------------
  # API FastAPI (agente + RAG + memoria)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-poc-app:local
    depends_on:
      llm:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      production-api:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - erp-data:/data/erp
      - app-data:/data/app
      - vector-store:/data/vector_store
      - documents:/data/documents
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10).status==200 else 1)\""]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # UI Chainlit
  # ---------------------------------------------------------------------------
  chainlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-poc-app:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8585:8585"
    command: >
      chainlit run src/agentic_poc/ui/app.py
      --host 0.0.0.0 --port 8585
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8585/health', timeout=5).status < 500 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
